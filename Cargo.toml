[package]
name = "identity-aware-tls-rev-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Identity-aware mTLS reverse proxy with SPIFFE authorization"
default-run = "identity-aware-tls-rev-proxy"

[dependencies]
anyhow = "1.0"
axum = "0.8"
bytes = "1.10"
http = "1.3"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.7", features = ["http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "server", "server-auto", "service", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.18", features = ["v4"] }
x509-parser = "0.17"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
